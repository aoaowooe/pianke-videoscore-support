<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>片刻配乐技术支持</title>
  <style>
    :root {
      color-scheme: light;
      color: #17333d;
      background: #f3f7f7;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.75;
    }

    body { margin: 0; }
    main { max-width: 42rem; margin: auto; padding: clamp(1.5rem, 5vw, 3.5rem) 1.25rem; }
    header { padding-bottom: 1.35rem; border-bottom: 1px solid #cddcdc; }
    h1 { margin: 0; font-size: clamp(1.65rem, 5vw, 2.35rem); line-height: 1.3; }
    section { margin-top: 1.5rem; }
    h2 { margin: 0 0 .35rem; font-size: 1.125rem; }
    p { margin: 0; }
    a { color: #115a66; text-underline-offset: .2em; }
    a:focus-visible { outline: 2px solid #115a66; outline-offset: 3px; }
    footer { margin-top: 1.75rem; padding-top: 1rem; border-top: 1px solid #cddcdc; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>片刻配乐技术支持</h1>
    </header>

    <section aria-labelledby="materials">
      <h2 id="materials">找不到素材？</h2>
      <p>请先把视频或音频保存到 iPhone，再从相册或「文件」选择。</p>
    </section>

    <section aria-labelledby="photos">
      <h2 id="photos">成片没有出现在相册？</h2>
      <p>请在 iPhone 的「设置」中检查片刻配乐的相册添加权限。如果 App 已提示成片生成但保存失败，可以点「重试保存到相册」。</p>
    </section>

    <section aria-labelledby="restore">
      <h2 id="restore">已经买断但尚未解锁？</h2>
      <p>请使用购买时的 Apple 账户，点首页的「长视频一次买断」，再点「恢复购买」。</p>
    </section>

    <section aria-labelledby="contact">
      <h2 id="contact">联系开发者</h2>
      <p>需要帮助或有隐私问题，请发邮件到 <a href="mailto:kaikouabroad@126.com">kaikouabroad@126.com</a>。来信可附上 iPhone 型号、iOS 和 App 版本，以及问题发生前的操作步骤。</p>
    </section>

    <footer>
      <a href="privacy.html">隐私政策</a>
    </footer>
  </main>
</body>
</html>
